<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cognitivo Gym · Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--purple:#7c3aed;--purple-deep:#5b21b6;--orange:#f37418;--dark:#0a0a0f;--text:#fff;--muted:#8892a0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}

/* ── El fondo, que respira ──────────────────────────────────────
   Tres manchas de color muy desenfocadas que se mueven despacio.
   Se mueven con transform y nada mas: una pantalla Promethean no
   es un telefono nuevo, y animar posiciones o sombras la pone de
   rodillas. transform y opacity los hace la tarjeta grafica. */
#bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1a0f2e 0%,#000 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.orb.a{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:#7c3aed;animation:deriva1 26s ease-in-out infinite}
.orb.b{width:38vmax;height:38vmax;right:-12vmax;bottom:-14vmax;background:#f37418;opacity:.32;animation:deriva2 32s ease-in-out infinite}
.orb.c{width:30vmax;height:30vmax;left:40%;top:55%;background:#5b21b6;opacity:.38;animation:deriva3 38s ease-in-out infinite}
@keyframes deriva1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
@keyframes deriva2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-7vmax,-5vmax,0) scale(1.2)}}
@keyframes deriva3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-6vmax,4vmax,0) scale(.85)}}

/* Unas chispas, pocas. Seis se ven; sesenta se notan en el reloj. */
.mota{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.35;will-change:transform}
@keyframes sube{0%{transform:translateY(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-70vh);opacity:0}}

#center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:1}

/* ── La marca ───────────────────────────────────────────────────
   Las letras entran una detras de otra. Van escritas en el HTML,
   una por span, en vez de partirlas con JavaScript: asi entran
   aunque el guion tarde, que en un panel viejo tarda. */
.gate-title{font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.3rem,9.4vw,6.5rem);line-height:.98;letter-spacing:.02em;
  text-transform:uppercase;margin-bottom:18px;padding:0 6px}
/* Las palabras no se parten, pero la marca si puede bajar de linea.
   Con nowrap llenaba la pantalla de borde a borde en un telefono —y
   eso es CON la letra condensada cargada. Si Bebas no llega, que en
   un panel sin red o viejo puede pasar, la de repuesto es mas ancha
   y se saldria. Partir entre COGNITIVO y GYM es feo; salirse es
   peor, y pasa justo donde no se puede arreglar. */
.gate-title .w{display:inline-block;white-space:nowrap}
.gate-title .w+.w{margin-left:.3em}
.gate-title i{font-style:normal;display:inline-block;opacity:0;
  transform:translateY(.5em) scale(.9);
  animation:letra .62s cubic-bezier(.2,.8,.25,1) forwards}
.gate-title .g{color:var(--orange)}
@keyframes letra{to{opacity:1;transform:translateY(0) scale(1)}}

/* Y una vez dentro, late. El resplandor es lo unico que se mueve
   despues: la marca no debe seguir saltando mientras alguien
   escribe su codigo. */
.gate-title{animation:aliento 4.5s ease-in-out 1.6s infinite}
@keyframes aliento{
  0%,100%{text-shadow:0 0 26px rgba(124,58,237,.45),0 0 60px rgba(124,58,237,.18)}
  50%    {text-shadow:0 0 40px rgba(124,58,237,.75),0 0 100px rgba(243,116,24,.3)}}

.gate-sub{font-size:clamp(.82rem,2.6vw,1.12rem);font-weight:600;letter-spacing:.04em;
  color:#c6bcd8;margin-bottom:40px;opacity:0;
  animation:entra .8s ease-out 1.25s forwards}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.code-panel{width:100%;max-width:340px;opacity:0;
  animation:entra .8s ease-out 1.5s forwards}
.code-label{font-size:.68rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.code-input{width:100%;padding:16px;border-radius:10px;border:2px solid rgba(124,58,237,.4);background:rgba(255,255,255,.06);color:#fff;font-size:1.5rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;text-align:center;font-family:'Courier New',monospace}
.code-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 24px rgba(124,58,237,.35)}
.code-input.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.enter-btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--purple-deep));color:#fff;font-size:.9rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.enter-btn:active{transform:scale(.98)}
.enter-btn:disabled{opacity:.6;cursor:default}
.err{margin-top:14px;color:#ff8888;font-size:.82rem;font-weight:700;min-height:18px;line-height:1.45}

.brandmark{margin-top:44px;font-size:.68rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#4a5058;opacity:0;
  animation:entra .8s ease-out 1.9s forwards}
.brandmark b{color:var(--muted);font-style:italic}

/* Quien pide que no se mueva nada, no ve nada moverse. Es una
   preferencia del sistema y la pone alguien a quien el movimiento
   le sienta mal de verdad. Todo aparece, en su sitio, sin viaje. */
@media(prefers-reduced-motion:reduce){
  .orb,.mota,.gate-title{animation:none !important}
  .gate-title i,.gate-sub,.code-panel,.brandmark{
    animation:none !important;opacity:1 !important;transform:none !important}
  .gate-title{text-shadow:0 0 30px rgba(124,58,237,.5)}
}
</style>
</head>
<body>

<div id="bg" aria-hidden="true">
  <span class="orb a"></span><span class="orb b"></span><span class="orb c"></span>
  <span class="mota" style="left:12%;bottom:-6px;animation:sube 14s linear .4s infinite"></span>
  <span class="mota" style="left:28%;bottom:-6px;animation:sube 19s linear 2.6s infinite"></span>
  <span class="mota" style="left:47%;bottom:-6px;animation:sube 16s linear 5.1s infinite"></span>
  <span class="mota" style="left:66%;bottom:-6px;animation:sube 21s linear 1.3s infinite"></span>
  <span class="mota" style="left:81%;bottom:-6px;animation:sube 17s linear 7.4s infinite"></span>
  <span class="mota" style="left:92%;bottom:-6px;animation:sube 23s linear 3.9s infinite"></span>
</div>

<div id="center">
  <h1 class="gate-title" aria-label="Cognitivo Gym"><span class="w"><i style="animation-delay:120ms">C</i><i style="animation-delay:175ms">O</i><i style="animation-delay:230ms">G</i><i style="animation-delay:285ms">N</i><i style="animation-delay:340ms">I</i><i style="animation-delay:395ms">T</i><i style="animation-delay:450ms">I</i><i style="animation-delay:505ms">V</i><i style="animation-delay:560ms">O</i></span><span class="w g"><i style="animation-delay:615ms">G</i><i style="animation-delay:670ms">Y</i><i style="animation-delay:725ms">M</i></span></h1>
  <div class="gate-sub">Train Your Mind. Build Your Skills.</div>

  <div class="code-panel">
    <div class="code-label">Access Code</div>
    <input class="code-input" id="gate-code" maxlength="12" placeholder="• • • •" autocomplete="off" onkeydown="if(event.key==='Enter')tryEnter()">
    <button class="enter-btn" id="gate-btn" onclick="tryEnter()">Enter →</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div class="brandmark">Powered by <b>Gostar Digital</b></div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  LICENSE SYSTEM — one code, one product, three parts.
//
//  This is the single front door for everything on this site:
//  the memory games, Ritnome, and both standings boards. There
//  are no other gates. A code good for product='hooporia'
//  unlocks all of it, because it is all one product now.
//
//  To issue / expire / revoke codes, use admin.html. Codes also
//  arrive automatically from purchases made through Basketball
//  Money, which writes them into the same licenses table.
//
//  The licenses table is NOT readable from the browser. This
//  page asks the database one question through the check_license
//  function — "is this code good for this product?" — and gets
//  back only a yes or no plus the school name. Nobody can list
//  the codes, because nothing here can read the table. Expiry is
//  judged inside that function, on the database's own clock, so
//  an expired code cannot be waved through by editing this page
//  or changing a device's date.
//
//  DEVICE LIMIT — a sold code works on a set number of devices,
//  five by default. Codes created by hand in the license admin are
//  unlimited, since those are used to recruit schools and run free
//  trials. The count is kept and enforced by the database, not here,
//  so it cannot be sidestepped by editing this page. A device already
//  known is always let back in; only a new one can be refused.
//
//  The school name is written to BOTH 'hoop-school' and
//  'ritnome-school'. Each part's standings board reads its own
//  key, and both need the same answer — that is what keeps one
//  school's board separate from another's now that a single code
//  opens every board.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'hooporia';
// ══════════════════════════════════════════════════════

// A stable random id for this browser, kept in localStorage so it
// survives between visits. It identifies nothing about the person or
// the machine — it only lets the database tell one browser from
// another. Clearing site data makes a new one and costs a slot,
// which is why admin can reset a code's devices.
function deviceId(){
  var id = null;
  try { id = localStorage.getItem('gostar-device-id'); } catch(e){}
  if (!id){
    id = 'd-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    try { localStorage.setItem('gostar-device-id', id); } catch(e){}
  }
  return id;
}

if (sessionStorage.getItem('dynamic-memory-gate-pass') === '1') {
  window.location.replace('dynamic-hub.html');
}

var checking = false;

function tryEnter(){
  if (checking) return;

  var input = $('gate-code').value.trim();
  if (!input){ return; }

  checking = true;
  $('gate-btn').disabled = true;
  $('gate-err').style.color = '';
  $('gate-err').textContent = 'Checking…';

  fetch(SUPABASE_URL + '/rest/v1/rpc/check_access', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_code: input, p_product: PRODUCT, p_device: deviceId() })
  })
  .then(function(r){
    if (!r.ok) throw new Error('lookup failed');
    return r.json();
  })
  .then(function(lic){
    if (!lic || !lic.ok){
      // Each refusal says what actually happened. "Invalid code" for a
      // code that is real but out of device slots would send someone
      // hunting for a typo that is not there.
      if (lic && lic.reason === 'devices'){
        return reject('This code is already in use on ' + (lic.max_devices || 5) +
                      ' devices. Ask your administrator to reset it.');
      }
      if (lic && lic.reason === 'expired'){
        return reject('This access has expired — contact your administrator to renew.');
      }
      if (lic && lic.reason === 'revoked'){
        return reject('This code is no longer active.');
      }
      return reject('Invalid code — check with your administrator');
    }

    var code = input.toUpperCase();
    var school = lic.school_name || '';

    // One code opens every part. Each part still checks its own
    // pass key, so they are all set here rather than each part
    // asking for a code of its own.
    sessionStorage.setItem('dynamic-memory-gate-pass','1');
    sessionStorage.setItem('dynamic-memory-standings-gate-pass','1');
    sessionStorage.setItem('ritnome-gate-pass','1');
    sessionStorage.setItem('ritnome-standings-gate-pass','1');

    sessionStorage.setItem('hoop-license', code);
    sessionStorage.setItem('ritnome-license', code);

    sessionStorage.setItem('hoop-school', school);
    sessionStorage.setItem('ritnome-school', school);

    window.location.href = 'dynamic-hub.html';
  })
  .catch(function(){
    // A network or server failure is a different problem from a bad
    // code, and saying so saves someone hunting for a typo that
    // isn't there.
    reject('Connection problem — please try again');
  });
}

function reject(msg){
  checking = false;
  $('gate-btn').disabled = false;
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value=''; box.focus();
}

$('gate-code').focus();
</script>
</body>
</html>
